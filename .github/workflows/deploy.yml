name: Deploy Teambuilder to Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6 # Upgraded to v6 for Node 24 support

      - name: Setup Pages
        uses: actions/configure-pages@v5 # Upgraded to v5 for Node 24 support

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5 # Upgraded to v5 for Node 24 support
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
